name: mail-dispatcher-development
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: dispatcher
      POSTGRES_DB: dispatcher_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the local development database password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - intake-development:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher -d dispatcher_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  intake-development:
