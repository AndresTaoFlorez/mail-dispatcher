name: Graph foundation checks
on:
  pull_request:
  push:
    branches: [feat/graph-readonly-foundation]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dispatcher
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: dispatcher_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dispatcher:synthetic-ci-only@127.0.0.1:5432/dispatcher_test
      DATABASE_URL: postgresql://dispatcher:synthetic-ci-only@127.0.0.1:5432/dispatcher_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate -w database
      - run: npm run migrate -w database
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest wdd/tests -q
